name: Terraform Plan

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - run: terraform fmt -check -recursive ../../

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - run: terraform validate

      # terraform_state_bucket_arn has no default (it comes from the
      # infra/bootstrap output); every other variable falls back to a
      # placeholder default until real business details are supplied via a
      # committed terraform.tfvars (add -var-file=terraform.tfvars then).
      - name: Terraform Plan
        run: |
          terraform plan -no-color -input=false \
            -var="terraform_state_bucket_arn=arn:aws:s3:::${{ vars.TF_STATE_BUCKET }}"
